[project]
name = "arduino-telemetry-backend"
version = "0.1.0"
description = "FastAPI backend for Arduino Mega telemetry streaming over transport adapters."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.9.0",
  "pyserial>=3.5",
  "uvicorn[standard]>=0.35.0"
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

